name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. The 28 known failures this job was introduced with are all
      # resolved — DsaStudio.coverage, learn-palette-parity and blog-engagement
      # are green — so main sits at 358/358 across 46 files, and a red suite now
      # means the PR broke something.
      #
      # The tail is still written to the run summary on success and failure
      # alike, so the count stays visible without opening the job log.
      - name: Run vitest
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/vitest.log
        shell: bash

      - name: Publish result to the run summary
        if: always()
        run: |
          {
            echo '### Vitest'
            echo '```'
            tail -20 /tmp/vitest.log 2>/dev/null || echo 'no output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
