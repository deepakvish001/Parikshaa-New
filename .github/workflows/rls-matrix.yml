name: RLS Matrix

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-rls-matrix.mjs"
      - ".github/workflows/rls-matrix.yml"
  schedule:
    - cron: "0 4 * * *" # nightly at 04:00 UTC
  workflow_dispatch:

jobs:
  rls-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if secrets absent
        id: gate
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "RLS matrix skipped: repo secrets not set (safe on forks)."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.gate.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Run RLS matrix
        if: steps.gate.outputs.skip != 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          RLS_TEST_USER_EMAIL: ${{ secrets.RLS_TEST_USER_EMAIL }}
          RLS_TEST_USER_PASSWORD: ${{ secrets.RLS_TEST_USER_PASSWORD }}
        run: bun run check:rls
